name: Security Spine Pipeline
# ... (on: push/pull_request configuration)

permissions:
  contents: read
  packages: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Clears 2026 deprecation warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Irrevocable Typecheck
        # Fails the build if ANY package (including market.ts) has a syntax error
        run: bun run typecheck