name: Security Spine Pipeline
on:
  push:
    branches: [ main, turbo ]
  pull_request:
    branches: [ main, turbo ]

permissions:
  contents: read
  packages: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint