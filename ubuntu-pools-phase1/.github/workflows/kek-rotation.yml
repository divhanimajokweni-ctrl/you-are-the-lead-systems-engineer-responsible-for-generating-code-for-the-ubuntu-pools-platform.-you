name: KEK Rotation

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rotation'
        required: true
        type: string
  schedule:
    - cron: '0 0 1 * *'  # Monthly

jobs:
  rotate-kek:
    runs-on: ubuntu-latest
    environment: security
    permissions:
      contents: none
    steps:
      - name: Generate new KEK
        id: generate
        run: |
          NEW_KEK=$(openssl rand -hex 32)
          echo "new_kek=$NEW_KEK" >> $GITHUB_OUTPUT

      - name: Run KEK rotation script
        env:
          KEK_HEX: ${{ secrets.KEK_HEX }}
          NEW_KEK_HEX: ${{ steps.generate.outputs.new_kek }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bun run scripts/rotate-kek.ts

      - name: Update KEK secret
        uses: webfactory/ssh-agent@v0.8
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Notify of rotation
        run: |
          echo "KEK rotated at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> rotation-log.txt
          echo "Reason: ${{ github.event.inputs.reason || 'Scheduled' }}" >> rotation-log.txt
